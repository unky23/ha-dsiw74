name: Bug report
description: Report a problem with the CANAL+ Decoder integration
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the integration.
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: 2026.9.0
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      placeholder: 0.5.0
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
